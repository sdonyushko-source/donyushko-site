<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>S&amp;O IP — home page design options</title>
<!-- Entry page of the pitch demo: three design directions of the S&O IP home page on one screen.
     Cards follow the Moneteam case cards (coloured card, tag pills, round arrow, title at the bottom). EN by default, RU switch. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500&family=Fragment+Mono&display=swap" rel="stylesheet">
<style>
  :root { --ink: #0B0D10; --muted: #6B6B6D; --radius: 20px; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; color: var(--ink); font: 400 16px/1.5 "Geist", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; }
  .page { min-height: 100vh; max-width: 1480px; margin: 0 auto; padding: 28px 40px 36px; display: flex; flex-direction: column; }
  header { display: flex; justify-content: space-between; align-items: center; }
  header img { width: 44px; display: block; }
  .lang { display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: rgba(11,13,16,.05); }
  .lang button { border: 0; background: none; cursor: pointer; padding: 7px 14px; border-radius: 999px; font: 500 13px/1 "Geist", sans-serif; color: var(--muted); transition: background .2s, color .2s; }
  .lang button.on { background: var(--ink); color: #fff; }

  /* Title and text start on the same line */
  .intro { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: start; margin-top: 44px; }
  h1 { font-weight: 400; font-size: clamp(32px, 3.2vw, 48px); line-height: 1.1; letter-spacing: -0.015em; }
  .intro p { font-size: 17px; line-height: 1.55; color: #3A3B3E; max-width: 600px; }
  .intro p + p { margin-top: 10px; }

  /* Cards: as the Moneteam case cards — black card, one tag, round arrow, screenshot running to the bottom
     edge with a progressive blur under the title (layered backdrop-filter, same as Moneteam / Hi,Life) */
  .cards { flex: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-top: 36px; }
  .card { position: relative; display: flex; flex-direction: column; justify-content: space-between; min-height: 560px; padding: 28px;
    border-radius: var(--radius); background: #0B0D10; color: #fff; isolation: isolate; clip-path: inset(0 round var(--radius)); transition: transform .35s cubic-bezier(.2,.7,.2,1); }
  .card:hover { transform: translateY(-6px); }
  .top { position: relative; z-index: 2; display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  .tag { font-size: 12px; font-weight: 500; padding: 6px 12px; border-radius: 999px; background: #fff; color: var(--ink); }
  .arrow { flex-shrink: 0; width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; font-size: 20px; background: #fff; color: var(--ink); transition: transform .3s; }
  .card:hover .arrow { transform: rotate(-45deg); }
  .shot { position: absolute; z-index: -1; left: 28px; right: 28px; top: 96px; bottom: 0; width: calc(100% - 56px); height: calc(100% - 96px);
    object-fit: cover; object-position: center top; border-radius: 12px 12px 0 0; transition: transform .5s cubic-bezier(.2,.7,.2,1); }
  .card:hover .shot { transform: translateY(-8px); }
  .blur { position: absolute; left: 0; right: 0; bottom: 0; height: 46%; pointer-events: none;
    background: linear-gradient(to bottom, transparent 0%, rgba(11,13,16,.55) 55%, rgba(11,13,16,.85) 100%); }
  .blur i { position: absolute; inset: 0; }
  .blur i:nth-child(1) { backdrop-filter: blur(1.5px); -webkit-backdrop-filter: blur(1.5px); mask-image: linear-gradient(transparent 0%, #000 20%, #000 40%, transparent 60%); -webkit-mask-image: linear-gradient(transparent 0%, #000 20%, #000 40%, transparent 60%); }
  .blur i:nth-child(2) { backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); mask-image: linear-gradient(transparent 20%, #000 40%, #000 60%, transparent 80%); -webkit-mask-image: linear-gradient(transparent 20%, #000 40%, #000 60%, transparent 80%); }
  .blur i:nth-child(3) { backdrop-filter: blur(7px); -webkit-backdrop-filter: blur(7px); mask-image: linear-gradient(transparent 40%, #000 60%, #000 80%, transparent 100%); -webkit-mask-image: linear-gradient(transparent 40%, #000 60%, #000 80%, transparent 100%); }
  .blur i:nth-child(4) { backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); mask-image: linear-gradient(transparent 60%, #000 80%, #000 100%); -webkit-mask-image: linear-gradient(transparent 60%, #000 80%, #000 100%); }
  .blur i:nth-child(5) { backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); mask-image: linear-gradient(transparent 80%, #000 100%); -webkit-mask-image: linear-gradient(transparent 80%, #000 100%); }
  /* Firefox: backdrop blur doesn't render inside these cards, so a blurred copy of the screenshot fades in at the bottom */
  .blur-ff { display: none; }
  html.ff .blur i { display: none; }
  /* the copy is clipped to the screenshot's own box and slightly oversized, so its blurred edges never go see-through */
  html.ff .blur-ff { display: block; position: absolute; z-index: 0; left: 28px; right: 28px; top: 96px; bottom: 0; overflow: hidden; border-radius: 12px 12px 0 0; pointer-events: none;
    -webkit-mask-image: linear-gradient(to bottom, transparent 50%, #000 75%); mask-image: linear-gradient(to bottom, transparent 50%, #000 75%); }
  html.ff .blur-ff .shot { z-index: 0; left: -24px; right: auto; top: -24px; width: calc(100% + 48px); height: calc(100% + 48px); border-radius: 0; filter: blur(18px); transition: none; }
  @media (max-width: 1000px) { html.ff .blur-ff { left: 24px; right: 24px; top: 88px; } }
  html.ff .blur { z-index: 0; }
  .text { position: relative; z-index: 2; }
  .card h2 { font-weight: 400; font-size: clamp(26px, 2.3vw, 34px); line-height: 1.1; margin-bottom: 10px; }
  .card p { font-size: 15px; line-height: 1.5; opacity: .8; max-width: 420px; }

  @media (max-width: 1000px) {
    .page { padding: 20px 16px 28px; }
    .intro { grid-template-columns: 1fr; gap: 14px; margin-top: 32px; }
    .cards { grid-template-columns: 1fr; }
    .card { min-height: 520px; padding: 24px; }
    .shot { left: 24px; right: 24px; width: calc(100% - 48px); top: 88px; height: calc(100% - 88px); object-position: left top; }
  }
</style>
<script>
  if (/firefox/i.test(navigator.userAgent)) document.documentElement.classList.add("ff");
  // Language: English by default, the choice is remembered
  let lang = "en";
  try { lang = localStorage.getItem("so-lang") || "en"; } catch (e) {}
</script>
</head>
<body>
  <div class="page">
    <header>
      <img src="assets/LOGO_SchmittOrlov.svg" alt="S&amp;O IP">
      <div class="lang" role="group" aria-label="Language"><button data-l="en">EN</button><button data-l="ru">RU</button></div>
    </header>

    <section class="intro">
      <h1 data-en="Three design options for the S&amp;O&nbsp;IP home page" data-ru="Три варианта дизайна главной страницы S&amp;O&nbsp;IP"></h1>
      <div>
        <p data-en="These are clickable prototypes of the home page of the new website. All three share the same structure and copy, taken from the current site so-ipr.com — only the design differs, so the options are easy to compare."
           data-ru="Это кликабельные прототипы главной страницы будущего сайта. Структура и тексты у всех трёх одинаковые — они взяты с текущего сайта so-ipr.com. Отличается только оформление, поэтому варианты удобно сравнивать между собой."></p>
        <p data-en="Photos are placeholders from the free Unsplash library; the final site will use your own."
           data-ru="Фотографии временные, из свободного фотобанка Unsplash. На финальном сайте будут ваши."></p>
      </div>
    </section>

    <div class="cards">
      <a class="card" href="v1/">
        <div class="top"><span class="tag" data-en="Option 01" data-ru="Вариант 01"></span><span class="arrow" aria-hidden="true">→</span></div>
        <img class="shot" src="assets/previews/v1.jpg?v=20261022" alt="">
        <span class="blur-ff" aria-hidden="true"><img class="shot" src="assets/previews/v1.jpg?v=20261022" alt=""></span>
        <span class="blur" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
        <div class="text">
          <h2 data-en="Strict and graphic" data-ru="Строгий и графичный"></h2>
          <p data-en="Monospace type, dark blocks and a fine grid. The office map draws itself as you scroll." data-ru="Моноширинный шрифт, тёмные блоки и тонкая сетка. Карта офисов рисуется при прокрутке."></p>
        </div>
      </a>
      <a class="card" href="v2/">
        <div class="top"><span class="tag" data-en="Option 02" data-ru="Вариант 02"></span><span class="arrow" aria-hidden="true">→</span></div>
        <img class="shot" src="assets/previews/v2.jpg?v=20261022" alt="">
        <span class="blur-ff" aria-hidden="true"><img class="shot" src="assets/previews/v2.jpg?v=20261022" alt=""></span>
        <span class="blur" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
        <div class="text">
          <h2 data-en="Bold typography" data-ru="Крупная типографика"></h2>
          <p data-en="Upper-case headlines and full-width photos. Regions are shown as case studies with panels over the photos." data-ru="Заголовки капсом и фото на всю ширину. Регионы показаны как кейсы с плашками поверх фото."></p>
        </div>
      </a>
      <a class="card" href="v3/">
        <div class="top"><span class="tag" data-en="Option 03" data-ru="Вариант 03"></span><span class="arrow" aria-hidden="true">→</span></div>
        <img class="shot" src="assets/previews/v3.jpg?v=20261022" alt="">
        <span class="blur-ff" aria-hidden="true"><img class="shot" src="assets/previews/v3.jpg?v=20261022" alt=""></span>
        <span class="blur" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
        <div class="text">
          <h2 data-en="Light and modern" data-ru="Светлый и современный"></h2>
          <p data-en="An interactive globe with the offices, soft gradients and rounded cards." data-ru="Интерактивный глобус с офисами, мягкие градиенты и скругленные карточки."></p>
        </div>
      </a>
    </div>
  </div>

<script>
  const btns = [...document.querySelectorAll(".lang button")];
  const apply = (l) => {
    document.documentElement.lang = l;
    document.querySelectorAll("[data-en]").forEach((el) => (el.innerHTML = el.dataset[l]));
    document.title = l === "ru" ? "S&O IP — варианты дизайна главной" : "S&O IP — home page design options";
    btns.forEach((b) => b.classList.toggle("on", b.dataset.l === l));
    try { localStorage.setItem("so-lang", l); } catch (e) {}
  };
  btns.forEach((b) => b.addEventListener("click", () => apply(b.dataset.l)));
  apply(lang === "ru" ? "ru" : "en");
</script>
</body>
</html>
