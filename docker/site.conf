ServerTokens Prod
ServerSignature Off

DirectoryIndex index.php index.html

<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE text/html text/css application/javascript text/plain image/svg+xml
</IfModule>

<IfModule mod_expires.c>
    ExpiresActive On
    ExpiresByType image/webp "access plus 30 days"
    ExpiresByType image/png "access plus 30 days"
    ExpiresByType image/jpeg "access plus 30 days"
    ExpiresByType image/svg+xml "access plus 30 days"
    ExpiresByType font/woff2 "access plus 1 year"
    ExpiresByType text/css "access plus 7 days"
    ExpiresByType application/javascript "access plus 7 days"
</IfModule>

<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
</IfModule>

# Private crypto forecast log (/crypto/): basic auth. The login and password are NOT in the repository:
# docker/start.sh writes the password file from the app variables CRYPTO_USER and CRYPTO_PASS at container start.
# Without them the password file is empty and the page stays closed for everyone.
<Directory /var/www/html/crypto>
    AuthType Basic
    AuthName "Private"
    AuthUserFile /etc/apache2/crypto.htpasswd
    Require valid-user
    Header always set X-Robots-Tag "noindex, nofollow"
    Header always set Cache-Control "no-store"
</Directory>
